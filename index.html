<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 11 Science - VIP Portal</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">

  <!-- आपका 100% पहले जैसा CSS डिज़ाइन -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f0f7ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      border: 2px solid #007bff;
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.15);
      text-align: center;
    }
    .badge {
      background: #007bff;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 15px;
    }
    h2 {
      color: #1a2a3a;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #6c757d;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1e3f8;
      border-radius: 10px;
      background-color: #f8fbff;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #007bff;
      background-color: #fff;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    .btn-submit:hover {
      background: #0056b3;
    }
    #error-message {
      color: #d9534f;
      font-size: 13px;
      margin-top: 15px;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <!-- आपका पहले जैसा ही सेम टू सेम फॉर्म -->
  <div class="container">
    <div class="badge">FIREBASE SECURE VIP</div>
    <h2>Class 11 Science</h2>
    <p class="subtitle">Enter Details for Secure Access</p>

    <form id="registerForm">
      <div class="form-group">
        <label>Your Name:</label>
        <input type="text" id="name" placeholder="Ratan Kumar" required>
      </div>

      <div class="form-group">
        <label>Class:</label>
        <select id="classSelect">
          <option value="Class 11 Science">Class 11 Science</option>
        </select>
      </div>

      <div class="form-group">
        <label>Board:</label>
        <select id="boardSelect">
          <option value="JAC Board (Jharkhand)">JAC Board (Jharkhand)</option>
          <option value="CBSE Board">CBSE Board</option>
          <option value="Bihar Board">Bihar Board</option>
        </select>
      </div>

      <div class="form-group">
        <label>Email ID:</label>
        <input type="email" id="email" placeholder="heymusicvibes96083@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Email Password:</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label>Mobile Number:</label>
        <input type="tel" id="mobile" placeholder="9608348509" required>
      </div>

      <button type="submit" class="btn-submit">REGISTER & GET OTP</button>
      <div id="error-message"></div>
    </form>
  </div>

  <!-- Firebase Script + PDF ओपन होने का पूरा कोड -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ✅ आपकी असली API Key और Project ID यहाँ सेट कर दी गई है:
    const firebaseConfig = {
      apiKey: "AIzaSyCM5U_JM4Lwsc_utILGb3RLRYGSB5BHjsc",
      authDomain: "class-11-science-app-2ca23.firebaseapp.com",
      projectId: "class-11-science-app-2ca23",
      storageBucket: "class-11-science-app-2ca23.appspot.com",
      messagingSenderId: "class-11-science-app-2ca23",
      appId: "1:class-11-science-app-2ca23:web:a1b2c3d4e5f6"
    };

    // ✅ सैंपल PDF का लिंक (बटन दबाते ही यह PDF अपने-आप खुल जाएगा):
    const pdfUrl = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("registerForm");
    const errorDiv = document.getElementById("error-message");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      errorDiv.style.display = "none";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("बधाई हो! आपका रजिस्ट्रेशन सफल हो गया है। अब PDF नोट्स खुल रहे हैं...");
          window.location.href = pdfUrl;
        })
        .catch((error) => {
          errorDiv.style.display = "block";
          if (error.code === "auth/email-already-in-use") {
            alert("आपका ईमेल पहले से रजिस्टर है। PDF नोट्स खुल रहे हैं...");
            window.location.href = pdfUrl;
          } else if (error.code === "auth/weak-password") {
            errorDiv.innerHTML = "❌ पासवर्ड कम से कम 6 अक्षरों का होना चाहिए!";
          } else {
            errorDiv.innerHTML = "❌ Error: " + error.message;
          }
        });
    });
  </script>
</body>
</html>
